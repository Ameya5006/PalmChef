<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#0f172a" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/logo.png" type="image/png" />
    <title>PalmChef — The Hands-Free Kitchen Assistant</title>
  </head>
  <body class="h-full bg-white text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <noscript>This app needs JavaScript to run.</noscript>
    <div id="root"></div>
    <script>
      (async () => {
        const isLocalhost =
          location.hostname === 'localhost' ||
          location.hostname === '127.0.0.1' ||
          location.hostname === '[::1]'

        if (!isLocalhost || !('serviceWorker' in navigator)) return

        const registrations = await navigator.serviceWorker.getRegistrations()
        const hadPalmChefSW = registrations.some((registration) =>
          registration.active?.scriptURL?.includes('/sw.js')
        )

        await Promise.all(registrations.map((registration) => registration.unregister()))

        if ('caches' in window) {
          const cacheKeys = await caches.keys()
          await Promise.all(
            cacheKeys
              .filter((key) => key.startsWith('palmchef'))
              .map((key) => caches.delete(key))
          )
        }

        if (hadPalmChefSW && !sessionStorage.getItem('palmchef-dev-sw-cleared')) {
          sessionStorage.setItem('palmchef-dev-sw-cleared', '1')
          location.reload()
        }
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
